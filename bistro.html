<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>享味 Bistro | 互動線上菜單</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
  body { font-family: 'Noto Sans TC', sans-serif; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-24">

<!-- 頂部導航欄 -->
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md shadow-sm border-b border-slate-100">
  <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-amber-500 rounded-full flex items-center justify-center text-white text-xl font-bold">
        <i class="fa-solid fa-utensils"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold text-slate-900 leading-tight">享味 Bistro</h1>
        <p class="text-xs text-slate-500">法式美學 × 在地食材</p>
      </div>
    </div>
    <button onclick="toggleCart()" class="relative p-2.5 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded-full transition-all duration-200">
      <i class="fa-solid fa-basket-shopping text-xl"></i>
      <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
    </button>
  </div>
</header>

<!-- 主體區域 -->
<main class="max-w-6xl mx-auto px-4 pt-6">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
    <div class="relative flex-1">
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
      <input type="text" id="search-input" placeholder="搜尋菜色名稱或關鍵字..."
        oninput="filterMenu()"
        class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 text-sm transition-all">
    </div>
    <div class="flex items-center space-x-2 overflow-x-auto pb-2 md:pb-0 custom-scrollbar" id="category-tags">
      <button onclick="setCategory('all')"       class="category-btn active px-4 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-amber-500 text-white shadow-sm shadow-amber-200">全部菜色</button>
      <button onclick="setCategory('main')"      class="category-btn px-4 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-white text-slate-600 hover:bg-slate-100 border border-slate-200">精選主餐</button>
      <button onclick="setCategory('appetizer')" class="category-btn px-4 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-white text-slate-600 hover:bg-slate-100 border border-slate-200">開胃前菜</button>
      <button onclick="setCategory('dessert')"   class="category-btn px-4 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-white text-slate-600 hover:bg-slate-100 border border-slate-200">手作甜點</button>
      <button onclick="setCategory('drink')"     class="category-btn px-4 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-white text-slate-600 hover:bg-slate-100 border border-slate-200">特調飲品</button>
      <button onclick="setCategory('soup')"      class="category-btn px-4 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-white text-slate-600 hover:bg-slate-100 border border-slate-200">精燉湯品</button>
    </div>
  </div>

  <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

  <div id="empty-state" class="hidden text-center py-16">
    <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400 text-2xl">
      <i class="fa-solid fa-utensils"></i>
    </div>
    <h3 class="text-lg font-bold text-slate-700">未找到符合條件的菜色</h3>
    <p class="text-sm text-slate-400 mt-1">請嘗試更換關鍵字或選擇其他分類</p>
  </div>
</main>

<!-- 底部結帳列 -->
<div id="bottom-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-4 shadow-lg z-20 transform translate-y-full transition-transform duration-300">
  <div class="max-w-6xl mx-auto flex items-center justify-between">
    <div>
      <span class="text-xs text-slate-500">預計總金額</span>
      <div class="text-xl font-bold text-amber-600">NT$ <span id="bar-total">0</span></div>
    </div>
    <button onclick="toggleCart()" class="bg-amber-500 hover:bg-amber-600 active:scale-95 text-white px-6 py-3 rounded-xl font-bold text-sm shadow-md transition-all flex items-center space-x-2">
      <span>查看點餐單</span>
      <i class="fa-solid fa-chevron-right text-xs"></i>
    </button>
  </div>
</div>

<!-- 菜色詳情 Modal -->
<div id="detail-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 opacity-0 pointer-events-none transition-opacity duration-300">
  <div class="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300 relative" id="modal-content">
    <button onclick="closeModal()" class="absolute top-4 right-4 z-10 bg-black/40 hover:bg-black/60 text-white w-9 h-9 rounded-full flex items-center justify-center backdrop-blur-md transition-all">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <img id="modal-img" src="" alt="" class="w-full h-64 object-cover">
    <div class="p-6">
      <div class="flex justify-between items-start mb-2">
        <h2 id="modal-title" class="text-2xl font-bold text-slate-900"></h2>
        <span id="modal-price" class="text-xl font-bold text-amber-600"></span>
      </div>
      <p id="modal-desc" class="text-slate-600 text-sm mb-4 leading-relaxed"></p>
      <div class="flex flex-wrap gap-2 mb-6" id="modal-tags"></div>
      <button id="modal-add-btn" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 rounded-2xl shadow-lg transition-all flex items-center justify-center space-x-2">
        <i class="fa-solid fa-plus"></i>
        <span>加入點餐單</span>
      </button>
    </div>
  </div>
</div>

<!-- 購物車 Drawer -->
<div id="cart-drawer" class="fixed inset-0 z-50 pointer-events-none">
  <div id="cart-overlay" onclick="toggleCart()" class="absolute inset-0 bg-black/50 opacity-0 transition-opacity duration-300"></div>
  <div id="cart-panel" class="absolute top-0 right-0 bottom-0 w-full max-w-md bg-white shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col pointer-events-auto">
    <div class="p-5 border-b border-slate-100 flex items-center justify-between">
      <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
        <i class="fa-solid fa-receipt text-amber-500"></i> 我的點餐單
      </h2>
      <button onclick="toggleCart()" class="text-slate-400 hover:text-slate-600 p-2">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
    </div>
    <div id="cart-items" class="flex-1 overflow-y-auto p-5 space-y-4 custom-scrollbar"></div>
    <div class="p-5 border-t border-slate-100 bg-slate-50 space-y-4">
      <div class="flex justify-between text-slate-600 text-sm"><span>小計</span><span>NT$ <span id="cart-subtotal">0</span></span></div>
      <div class="flex justify-between text-slate-600 text-sm"><span>服務費 (10%)</span><span>NT$ <span id="cart-service">0</span></span></div>
      <div class="flex justify-between text-slate-900 font-bold text-lg pt-2 border-t border-slate-200">
        <span>總計</span><span class="text-amber-600">NT$ <span id="cart-total">0</span></span>
      </div>
      <button onclick="submitOrder()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-md transition-all text-center">
        確認送出餐點
      </button>
    </div>
  </div>
</div>

    { id:32, name:'莫希托（Mojito）',         category:'drink',     price:200, image:'https://images.unsplash.com/photo-1560508180-03f285f67ded?auto=format&fit=crop&w=800&q=80', description:'新鮮薄荷葉、萊姆汁與蔗糖漿搖製，注入蘇打水，可含酒精或無酒精。', tags:['可選無酒精'] },
    { id:33, name:'黑糖珍珠鮮奶茶',          category:'drink',     price:150, image:'https://images.unsplash.com/photo-1558857563-b371033873b8?auto=format&fit=crop&w=800&q=80', description:'大葉烏龍茶底配手工黑糖珍珠，搭配每日新鮮直送鮮奶，甜度可調。', tags:['人氣推薦','甜度可調'] },
    { id:34, name:'伯爵奶茶',                category:'drink',     price:145, image:'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=800&q=80', description:'正山小種混調佛手柑伯爵茶，以法式奶茶比例沖泡，滑順不苦澀。', tags:['含咖啡因'] },

    // ── 精燉湯品 ──
    { id:35, name:'法式洋蔥湯',              category:'soup',      price:220, image:'https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=800&q=80', description:'洋蔥慢炒一小時至深琥珀色，以牛骨高湯燉煮，蓋上格律耶爾起司焗烤。', tags:['主廚推薦'] },
    { id:36, name:'濃縮龍蝦海鮮巧達湯',      category:'soup',      price:280, image:'https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=800&q=80', description:'波士頓龍蝦殼熬製濃湯底，加入干貝、蛤蜊與鮮奶油，灑紅椒粉。', tags:['海鮮','季節限定'] },
    { id:37, name:'義式蕃茄麵包濃湯',        category:'soup',      price:180, image:'https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=800&q=80', description:'托斯卡尼農家食譜，熟透番茄與昨日麵包燉成濃稠暖湯，淋初榨橄欖油。', tags:['蛋奶素','無麩質可選'] },
    { id:38, name:'泰式椰漿南瓜濃湯',        category:'soup',      price:190, image:'https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=800&q=80', description:'烤南瓜與椰漿打成絲滑濃湯，以香茅與薑黃調味，點綴椰奶漩渦。', tags:['純素','無麩質'] },
  ];

  // ── 購物車狀態 ──
  let cart = [];
  let currentCategory = 'all';
  let cartOpen = false;

  // ── 初始化 ──
  function init() {
    filterMenu();
  }

  // ── 分類篩選 ──
  function setCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('.category-btn').forEach(btn => {
      const isActive = btn.getAttribute('onclick').includes(`'${cat}'`);
      btn.className = isActive
        ? 'category-btn active px-4 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-amber-500 text-white shadow-sm shadow-amber-200'
        : 'category-btn px-4 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-white text-slate-600 hover:bg-slate-100 border border-slate-200';
    });
    filterMenu();
  }

  // ── 搜尋 + 篩選渲染 ──
  function filterMenu() {
    const query = document.getElementById('search-input').value.toLowerCase();
    const filtered = menuData.filter(item => {
      const matchCat = currentCategory === 'all' || item.category === currentCategory;
      const matchSearch = item.name.toLowerCase().includes(query) ||
                          item.description.toLowerCase().includes(query) ||
                          item.tags.some(t => t.toLowerCase().includes(query));
      return matchCat && matchSearch;
    });
    renderMenu(filtered);
  }

  // ── 渲染菜單卡片 ──
  function renderMenu(items) {
    const grid = document.getElementById('menu-grid');
    const empty = document.getElementById('empty-state');
    if (items.length === 0) {
      grid.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');
    grid.innerHTML = items.map(item => {
      const inCart = cart.find(c => c.id === item.id);
      return `
        <div class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-lg transition-all duration-300 cursor-pointer group border border-slate-100"
             onclick="openModal(${item.id})">
          <div class="relative overflow-hidden h-48">
            <img src="${item.image}" alt="${item.name}"
                 class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            <div class="absolute top-3 left-3 flex flex-wrap gap-1">
              ${item.tags.map(t => `<span class="bg-amber-500 text-white text-xs px-2 py-0.5 rounded-full font-medium">${t}</span>`).join('')}
            </div>
          </div>
          <div class="p-4">
            <h3 class="font-bold text-slate-900 text-base mb-1 line-clamp-1">${item.name}</h3>
            <p class="text-slate-500 text-xs line-clamp-2 mb-3 leading-relaxed">${item.description}</p>
            <div class="flex items-center justify-between">
              <span class="text-amber-600 font-bold text-lg">NT$ ${item.price}</span>
              <button onclick="event.stopPropagation(); addToCart(${item.id})"
                      class="w-9 h-9 rounded-full flex items-center justify-center transition-all
                             ${inCart ? 'bg-amber-500 text-white' : 'bg-amber-50 text-amber-600 hover:bg-amber-100'}">
                <i class="fa-solid ${inCart ? 'fa-check' : 'fa-plus'} text-sm"></i>
              </button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // ── Modal ──
  function openModal(id) {
    const item = menuData.find(i => i.id === id);
    if (!item) return;
    document.getElementById('modal-img').src = item.image;
    document.getElementById('modal-title').textContent = item.name;
    document.getElementById('modal-price').textContent = `NT$ ${item.price}`;
    document.getElementById('modal-desc').textContent = item.description;
    document.getElementById('modal-tags').innerHTML =
      item.tags.map(t => `<span class="bg-amber-100 text-amber-700 text-xs px-3 py-1 rounded-full font-medium">${t}</span>`).join('');
    const btn = document.getElementById('modal-add-btn');
    const inCart = cart.find(c => c.id === id);
    btn.innerHTML = inCart
      ? '<i class="fa-solid fa-check"></i><span>已加入點餐單</span>'
      : '<i class="fa-solid fa-plus"></i><span>加入點餐單</span>';
    btn.onclick = () => { addToCart(id); updateModalBtn(id); };

    const modal = document.getElementById('detail-modal');
    modal.classList.remove('opacity-0','pointer-events-none');
    document.getElementById('modal-content').classList.remove('scale-95');
    document.body.style.overflow = 'hidden';
  }

  function updateModalBtn(id) {
    const btn = document.getElementById('modal-add-btn');
    btn.innerHTML = '<i class="fa-solid fa-check"></i><span>已加入點餐單</span>';
  }

  function closeModal() {
    const modal = document.getElementById('detail-modal');
    modal.classList.add('opacity-0','pointer-events-none');
    document.getElementById('modal-content').classList.add('scale-95');
    document.body.style.overflow = '';
  }

  // ── 加入購物車 ──
  function addToCart(id) {
    const item = menuData.find(i => i.id === id);
    if (!item) return;
    const existing = cart.find(c => c.id === id);
    if (existing) { existing.qty++; }
    else { cart.push({ ...item, qty: 1 }); }
    updateCartUI();
    filterMenu();
  }

  // ── 更改數量 ──
  function changeQty(id, delta) {
    const idx = cart.findIndex(c => c.id === id);
    if (idx === -1) return;
    cart[idx].qty += delta;
    if (cart[idx].qty <= 0) cart.splice(idx, 1);
    updateCartUI();
    filterMenu();
  }

  // ── 更新購物車 UI ──
  function updateCartUI() {
    const totalQty = cart.reduce((s, c) => s + c.qty, 0);
    const subtotal  = cart.reduce((s, c) => s + c.price * c.qty, 0);
    const service   = Math.round(subtotal * 0.1);
    const total     = subtotal + service;

    // count badge
    const countEl = document.getElementById('cart-count');
    if (totalQty > 0) { countEl.textContent = totalQty; countEl.classList.remove('hidden'); }
    else { countEl.classList.add('hidden'); }

    // bottom bar
    const bar = document.getElementById('bottom-bar');
    if (totalQty > 0) { bar.classList.remove('translate-y-full'); }
    else { bar.classList.add('translate-y-full'); }
    document.getElementById('bar-total').textContent = total;

    // cart panel
    document.getElementById('cart-subtotal').textContent = subtotal;
    document.getElementById('cart-service').textContent  = service;
    document.getElementById('cart-total').textContent    = total;

    const cartItems = document.getElementById('cart-items');
    if (cart.length === 0) {
      cartItems.innerHTML = `
        <div class="flex flex-col items-center justify-center h-full text-slate-400 py-16">
          <i class="fa-solid fa-basket-shopping text-4xl mb-3 opacity-30"></i>
          <p class="text-sm">點餐單是空的，快去挑選菜色吧！</p>
        </div>`;
    } else {
      cartItems.innerHTML = cart.map(c => `
        <div class="flex items-center gap-4 bg-slate-50 rounded-2xl p-3">
          <img src="${c.image}" alt="${c.name}" class="w-14 h-14 object-cover rounded-xl flex-shrink-0">
          <div class="flex-1 min-w-0">
            <p class="font-medium text-slate-800 text-sm line-clamp-1">${c.name}</p>
            <p class="text-amber-600 font-bold text-sm">NT$ ${c.price}</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="changeQty(${c.id},-1)" class="w-7 h-7 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700 flex items-center justify-center text-sm transition-all">
              <i class="fa-solid fa-minus text-xs"></i>
            </button>
            <span class="w-5 text-center font-bold text-slate-800 text-sm">${c.qty}</span>
            <button onclick="changeQty(${c.id},1)"  class="w-7 h-7 rounded-full bg-amber-100 hover:bg-amber-200 text-amber-700 flex items-center justify-center text-sm transition-all">
              <i class="fa-solid fa-plus text-xs"></i>
            </button>
          </div>
        </div>`).join('');
    }
  }

  // ── 購物車抽屜開關 ──
  function toggleCart() {
    cartOpen = !cartOpen;
    const drawer  = document.getElementById('cart-drawer');
    const overlay = document.getElementById('cart-overlay');
    const panel   = document.getElementById('cart-panel');
    if (cartOpen) {
      drawer.classList.remove('pointer-events-none');
      overlay.classList.remove('opacity-0');
      panel.classList.remove('translate-x-full');
      document.body.style.overflow = 'hidden';
    } else {
      drawer.classList.add('pointer-events-none');
      overlay.classList.add('opacity-0');
      panel.classList.add('translate-x-full');
      document.body.style.overflow = '';
    }
  }

  // ── 送出訂單 ──
  function submitOrder() {
    if (cart.length === 0) return;
    const subtotal = cart.reduce((s, c) => s + c.price * c.qty, 0);
    const total    = subtotal + Math.round(subtotal * 0.1);
    alert(`✅ 訂單已送出！\n共 ${cart.reduce((s,c)=>s+c.qty,0)} 項菜色\n總金額：NT$ ${total}\n\n感謝光臨享味 Bistro！`);
    cart = [];
    updateCartUI();
    toggleCart();
    filterMenu();
  }

  // ── 啟動 ──
  init();
</script>
</body>
</html>
